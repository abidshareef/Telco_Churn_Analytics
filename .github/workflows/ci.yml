name: Skybrisk Telco Churn CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-and-tests:
    name: Lint, Audit, Unit & Integration Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Static AST Syntax, Security & Architecture Audit
        env:
          PYTHONPATH: src
        run: |
          python3 scripts/security_and_quality_audit.py

      - name: Run Unit Test Suite
        env:
          PYTHONPATH: src
        run: |
          python3 -m unittest discover -s tests/unit -p "test_*.py" -v

      - name: Execute End-to-End Data & Training Pipeline
        env:
          PYTHONPATH: src
        run: |
          python3 scripts/run_pipeline.py

      - name: Run Integration & Live REST API Test Suite
        env:
          PYTHONPATH: src
        run: |
          python3 -m unittest discover -s tests/integration -p "test_*.py" -v
